<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Server Error</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .error-500 {
            width: 100%;
            height: calc(100vh - 89px);
            background-color: #FFFFFF;
            overflow: hidden;
            font-family: 'Raleway', sans-serif;
        }
    
        .error-500__wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }
    
        .error-500__shape {
            position: absolute;
            top: 0;
            right: -50%;
        }
    
        .error-500__container {
            position: relative;
            z-index: 10;
            max-width: 1280px;
            margin: 0 auto;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }
    
        .error-500__content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 24px;
        }
    
        .error-500__title {
            font-size: 120px;
            font-weight: 500;
            line-height: 1em;
            color: #414042;
            text-align: center;
        }
    
        .error-500__text {
            font-size: 18px;
            font-weight: 400;
            line-height: 1.5em;
            color: #282828;
            text-align: center;
        }
    
        .error-500__button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border: 1px solid #282828;
            border-radius: 99px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
    
        .error-500__button:hover {
            background-color: #282828;
        }
    
        .error-500__button span {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5em;
            color: #282828;
            transition: all 0.2s ease;
        }
    
        .error-500__button:hover span {
            color: #FFFFFF;
        }
    
        @media screen and (min-width: 768px) {
            .error-500 {
                height: calc(100vh - 150px);
            }
    
            .error-500__shape {
                right: 0;
            }
    
            .error-500__container {
                padding: 120px 20px;
                gap: 40px;
            }
    
            .error-500__content {
                gap: 40px;
            }
    
            .error-500__title {
                font-size: 240px;
            }
    
            .error-500__text {
                font-size: 20px;
            }
    
            .error-500__button {
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>
    <main>        
        <div class="error-500">
            <div class="error-500__wrapper">
                <div class="error-500__shape">
                    <svg xmlns="http://www.w3.org/2000/svg" width="349" height="720" viewBox="0 0 349 720" fill="none">
                        <path d="M575.069 726.439C303.273 726.439 82.9337 506.595 82.9337 235.409C82.9337 46.9715 189.345 -116.678 345.484 -198.984L283.253 -292C114.009 -195.334 0 -13.3943 0 195.099C0 504.87 251.696 756 562.165 756C691.691 756 810.966 712.28 906 638.838L889.035 613.488C803.81 684.002 694.384 726.439 575.029 726.439H575.069Z" fill="#C1C6C8"/>
                    </svg>
                </div>
                
                <div class="error-500__container">
                    <div class="error-500__content">
                        <div class="error-500__title">500</div>
                        <div class="error-500__text">Internal Server Error</div>
                    </div>
                    <a onclick="window.location.reload()" class="error-500__button">
                        <span>Yenile</span>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
